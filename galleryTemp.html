<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./assets/css/output.css" rel="stylesheet" />
    <title>2026 Grad Show</title>
    <meta
      name="description"
      content="North Metro TAFE's Game Art and Animation graduates of 2026!"
    />
    <script>
      function galleryView(img) {
        //get the element of the expanded image
        let expandedImg = document.getElementById("expandedImg");

        // assign the src of the image being clicked on to the expanded image
        expandedImg.src = img.src;

        //show the container element
        expandedImg.parentElement.style.display = "block";
      }
    </script>
  </head>

  <body>
    <!--TITLE BAR-->
    <header
      class="h-40 bg-[url(https://placehold.co/1920x1080)] bg-cover bg-center"
    >
      <div class="">
        <h2 class="text-center text-xl">NORTH METRO TAFE - 2026 Graduates</h2>
        <h1 class="text-center text-5xl">Animation and Game Art</h1>
      </div>
    </header>

    <main id="pageMain" class="mx-auto">
      <br />
      <!--GALLERY-->
      <section
        class="mx-auto grid w-3/4 max-w-300 grid-cols-2 gap-2 md:grid-cols-6 md:gap-4"
      >
        <div class="aspect-square">
          <img
            class="h-full max-h-full w-full max-w-full rounded-lg object-cover object-center"
            src="./assets/images/0/gallery01.png"
            alt=""
            onclick="galleryView(this)"
          />
        </div>
        <div class="aspect-square">
          <img
            class="h-full max-h-full w-full max-w-full rounded-lg object-cover object-center"
            src="./assets/images/0/gallery02.png"
            alt=""
            onclick="galleryView(this)"
          />
        </div>
        <div class="aspect-square">
          <img
            class="h-full max-h-full w-full max-w-full rounded-lg object-cover object-center"
            src="./assets/images/0/gallery03.png"
            alt=""
            onclick="galleryView(this)"
          />
        </div>
        <div class="aspect-square">
          <img
            class="h-full max-h-full w-full max-w-full rounded-lg object-cover object-center"
            src="./assets/images/0/gallery04.png"
            alt=""
            onclick="galleryView(this)"
          />
        </div>
        <div class="aspect-square">
          <img
            class="h-full max-h-full w-full max-w-full rounded-lg object-cover object-center"
            src="./assets/images/0/gallery05.png"
            alt=""
            onclick="galleryView(this)"
          />
        </div>
        <div class="aspect-square">
          <img
            class="h-full max-h-full w-full max-w-full rounded-lg object-cover object-center"
            src="./assets/images/0/gallery06.png"
            alt=""
            onclick="galleryView(this)"
          />
        </div>
      </section>
      <br />
      <div
        id="imageViewer"
        class="fixed inset-0 hidden h-dvh bg-black/25"
        onclick="this.style.display = 'none'"
      >
        <!--actual image-->
        <img
          id="expandedImg"
          class="mx-auto my-25 aspect-auto max-h-3/4 max-w-3/4 md:max-w-1/2"
        />
      </div>
    </main>

    <footer class="h-30 bg-gray-200">
      <section></section>
    </footer>
  </body>
</html>
