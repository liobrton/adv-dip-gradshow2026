<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./assets/css/output.css" rel="stylesheet" />
    <title>2026 Grad Show</title>
    <meta
      name="description"
      content="North Metro TAFE's Game Art and Animation graduates of 2026!"
    />
    <script>
      function galleryView(img) {
        //get the element of the expanded image
        let expandedImg = document.getElementById("expandedImg");

        // assign the src of the image being clicked on to the expanded image
        expandedImg.src = img.src;

        //show the container element
        expandedImg.parentElement.style.display = "block";
      }

      function closeImage() {
        let expandedImg = document.getElementById("expandedImg");
        expandedImg.parentElement.style.display = "none";
      }
    </script>
  </head>

  <body>
    <!--TITLE BAR-->
    <header
      class="h-40 bg-[url(https://placehold.co/1920x1080)] bg-cover bg-center"
    >
      <div class="">
        <h2 class="text-center text-xl">NORTH METRO TAFE - 2026 Graduates</h2>
        <h1 class="text-center text-5xl">Animation and Game Art</h1>
      </div>
    </header>

    <main id="pageMain" class="mx-auto"></main>

    <footer class="static inset-x-0 bottom-0 h-30 bg-gray-200">
      <section></section>
    </footer>
  </body>
  <script type="module" src="assets/js/utils/studentPage.js"></script>
</html>
